services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cms_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  langfuse:
    image: langfuse/langfuse:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cms_ai
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      APP_ENV: dev
      API_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - ollama
      - langfuse

  worker:
    build: .
    command: celery -A app.tasks.celery_app worker -l info
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - ollama

volumes:
  pgdata:
  ollama:
